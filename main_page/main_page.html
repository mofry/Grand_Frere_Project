
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Grand Frère - Sécurisez le budget repas</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    </head>
<body>

    <header class="main-header">
        <nav class="container">
            <div class="logo">
                <img src="assets/images/logo.svg" alt="Logo Grand Frère">
            </div>
            </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                
                <div class="hero-text">
                    <h1>
                        <span class="text-highlight">Les parents</span> et encadre les élèves
                    </h1>
                    <p>
                        Contrôlez et sécurisez le budget repas de vos enfants, directement au sein 
                        des établissements en réduisant les risques de dépenses superflues.
                    </p>
                    
                    <div class="cta-buttons">
                        <a href="#" class="btn btn-outline">Télécharger l'application</a>
                        <a href="#" class="btn btn-primary">Commencer maintenant</a>
                    </div>
                </div>

                <div class="hero-visual">
                    <img src="assets/images/hero-cards.png" alt="Cartes bancaires Grand Frère avec QR Code">
                </div>

            </div>
        </section>

        <section class="features">
            <div class="container">
                <span class="badge">La carte</span>
                <h2>La meilleure carte jamais créée</h2>
            </div>
        </section>
    </main>

    <footer>
        </footer>

</body>
</html>
